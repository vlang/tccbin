name: build and test (windows-amd64)

on:
  push:
    branches: [thirdparty-windows-amd64]
  pull_request:
    branches: [thirdparty-windows-amd64]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      # windows-latest runners default to core.autocrlf=true, which
      # silently rewrites LF to CRLF on checkout/clone. The patches
      # applied below (via git apply) are LF-only and match the repo's
      # stored blobs exactly - CRLF-converted working-tree files would
      # no longer match, and git apply would reject them as not applying.
      - name: disable CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      # thirdparty/libgc/gc.c (needed to rebuild libgc.a) and
      # thirdparty/tccbin_tests (the shared cross-platform conformance
      # suite - see its README) both live in the main v repo, not here.
      - name: checkout v (for thirdparty/libgc and thirdparty/tccbin_tests)
        uses: actions/checkout@v4
        with:
          repository: vlang/v
          ref: c82d3f08271e9324d6fb8de3c251e9c0e1a9154b
          sparse-checkout: |
            thirdparty/libgc
            thirdparty/tccbin_tests
            vlib/v/compiler_errors_test.v
          sparse-checkout-cone-mode: false
          path: work

      # this branch, checked out where build.ps1 expects to find itself
      # (work/thirdparty/tcc), matching a normal local checkout layout.
      - name: checkout this branch
        uses: actions/checkout@v4
        with:
          path: work/thirdparty/tcc

      - name: set up MinGW-w64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: build tcc.exe / libtcc.dll / i386-win32-tcc.exe / libgc.a
        shell: pwsh
        run: work/thirdparty/tcc/build.ps1

      - name: validate WinAPI declarations with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_create_symbolic_link.c"
          $x64Ansi = "$env:RUNNER_TEMP/winapi_create_symbolic_link_x64_ansi.exe"
          $x64Unicode = "$env:RUNNER_TEMP/winapi_create_symbolic_link_x64_unicode.exe"
          $i386Ansi = "$env:RUNNER_TEMP/winapi_create_symbolic_link_i386_ansi.exe"
          $i386Unicode = "$env:RUNNER_TEMP/winapi_create_symbolic_link_i386_unicode.exe"

          & work/thirdparty/tcc/tcc.exe `
              -Werror=implicit-function-declaration `
              -o $x64Ansi $probe
          if ($LASTEXITCODE -ne 0) {
              throw "x64 ANSI WinAPI conformance probe failed"
          }

          & work/thirdparty/tcc/tcc.exe `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $x64Unicode $probe
          if ($LASTEXITCODE -ne 0) {
              throw "x64 Unicode WinAPI conformance probe failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Werror=implicit-function-declaration `
              -o $i386Ansi $probe
          if ($LASTEXITCODE -ne 0) {
              throw "i386 ANSI WinAPI conformance probe failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $i386Unicode $probe
          if ($LASTEXITCODE -ne 0) {
              throw "i386 Unicode WinAPI conformance probe failed"
          }

      - name: run shared conformance tests
        shell: pwsh
        run: |
          work/thirdparty/tccbin_tests/run.ps1 -Tcc work/thirdparty/tcc/tcc.exe -Platform windows -- `
              -DGC_NOT_DLL -DGC_WIN32_THREADS -DGC_THREADS -DGC_BUILTIN_ATOMIC `
              -I work/thirdparty/libgc/include -bt25 -municode -ldbghelp -luser32 `
              work/thirdparty/tcc/lib/libgc.a
          if ($LASTEXITCODE -ne 0) { throw "conformance tests failed" }

      - name: upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: tccbin-windows-amd64-current
          path: |
            work/thirdparty/tcc/tcc.exe
            work/thirdparty/tcc/libtcc.dll
            work/thirdparty/tcc/i386-win32-tcc.exe
            work/thirdparty/tcc/lib/libgc.a
