name: build and test (windows-amd64)

on:
  push:
    branches: [thirdparty-windows-amd64]
  pull_request:
    branches: [thirdparty-windows-amd64]

permissions:
  contents: read

env:
  CONTRACT_REPOSITORY: vlang/v
  CONTRACT_SHA: 7545e515b434cd399333d43659238427d72e22e7
  VC_SHA: dfc458a13ba8923ebc249e262c331f8169aa728b
  PUBLISH: 'false'
  TCCBIN_PUBLISH: 'false'

jobs:
  build:
    if: >-
      github.repository == 'vlang/tccbin' &&
      (
        (github.event_name == 'pull_request' &&
          github.base_ref == 'thirdparty-windows-amd64') ||
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/thirdparty-windows-amd64')
      )
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # MSYS2's extensionless /ucrt64/bin/cc shim is translated by V to a
      # native path without .exe. Select the physical allowlisted compiler
      # name so both contract bootstrap and the baseline probe resolve gcc.exe.
      CC: gcc.exe
    steps:
      # windows-latest runners default to core.autocrlf=true, which
      # silently rewrites LF to CRLF on checkout/clone. The patches
      # applied below (via git apply) are LF-only and match the repo's
      # stored blobs exactly - CRLF-converted working-tree files would
      # no longer match, and git apply would reject them as not applying.
      - name: disable CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      # thirdparty/libgc/gc.c (needed to rebuild libgc.a) and
      # thirdparty/tccbin_tests (the shared cross-platform conformance
      # suite - see its README) both live in the main v repo, not here.
      - name: checkout v (for thirdparty/libgc and thirdparty/tccbin_tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vlang/v
          ref: ${{ env.CONTRACT_SHA }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: checkout immutable VC bootstrap snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vlang/vc
          ref: ${{ env.VC_SHA }}
          path: .tccbin-bootstrap-vc
          fetch-depth: 0
          persist-credentials: false

      - name: set up MinGW-w64 gcc
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
          cache: false

      - name: bootstrap contract-bound validator
        shell: msys2 {0}
        run: |
          set -euo pipefail
          validator_work="$RUNNER_TEMP/tccbin-validator-work"
          test ! -e "$validator_work"
          git -C work config --local core.autocrlf false
          git -C .tccbin-bootstrap-vc config --local core.autocrlf false
          bash work/thirdparty/tccbin_automation/bootstrap/bootstrap.sh \
            "$GITHUB_WORKSPACE/work" "$CONTRACT_REPOSITORY" "$CONTRACT_SHA" \
            "$GITHUB_WORKSPACE/.tccbin-bootstrap-vc" "$validator_work"
          {
            echo "TCCBIN_VALIDATOR_CLI=$validator_work/tccbin-automation.exe"
            echo "TCCBIN_VALIDATOR_CONTRACT_ROOT=$validator_work/contract-source"
          } >> "$GITHUB_ENV"

      # this branch, checked out where build.ps1 expects to find itself
      # (work/thirdparty/tcc), matching a normal local checkout layout.
      - name: checkout this branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: work/thirdparty/tcc
          fetch-depth: 0
          persist-credentials: false

      - name: 'phase A: physical manifest preflight + committed x64 V no-fallback smoke'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git -C work/thirdparty/tcc config --local core.autocrlf false
          bash work/thirdparty/tcc/automation/probes/baseline-contract.sh \
            "$TCCBIN_VALIDATOR_CLI" "$TCCBIN_VALIDATOR_CONTRACT_ROOT" \
            "$GITHUB_WORKSPACE/work/thirdparty/tcc" windows-amd64 \
            thirdparty-windows-amd64 "$CONTRACT_SHA" "$GITHUB_SHA" \
            "$GITHUB_WORKSPACE/.tccbin-bootstrap-vc"

      - name: build tcc.exe / libtcc.dll / i386-win32-tcc.exe / libgc.a
        shell: pwsh
        run: work/thirdparty/tcc/build.ps1

      - name: validate exp2 range with x64 and i386 TCC
        shell: pwsh
        run: |
          $test = "work/thirdparty/tcc/tests/math_exp2_range.c"
          $cases = @(
              @{ Name = "x64"; Compiler = "work/thirdparty/tcc/tcc.exe" },
              @{ Name = "i386"; Compiler = "work/thirdparty/tcc/i386-win32-tcc.exe" }
          )
          $failures = @()

          foreach ($case in $cases) {
              $token = [guid]::NewGuid().ToString("N")
              $executable = Join-Path $env:RUNNER_TEMP "math_exp2_range_$token.exe"
              try {
                  Write-Host "=== exp2 $($case.Name) compile: $($case.Compiler) ==="
                  $compileExit = 1
                  $compileException = $null
                  try {
                      & $case.Compiler -Wall -Werror -o $executable $test
                      $compileExit = $LASTEXITCODE
                  } catch {
                      $compileException = $_.Exception.Message
                  }

                  if ($compileExit -ne 0) {
                      $failure = "$($case.Name) compile/link exit=$compileExit"
                      if ($compileException) {
                          $failure += " exception=$compileException"
                      }
                      $failures += $failure
                      Write-Host "::error title=exp2 $($case.Name) compile::$failure"
                  } else {
                      Write-Host "=== exp2 $($case.Name) runtime ==="
                      $runtimeExit = 1
                      $runtimeException = $null
                      try {
                          & $executable
                          $runtimeExit = $LASTEXITCODE
                      } catch {
                          $runtimeException = $_.Exception.Message
                      }

                      if ($runtimeExit -ne 0) {
                          $failure = "$($case.Name) runtime exit=$runtimeExit"
                          if ($runtimeException) {
                              $failure += " exception=$runtimeException"
                          }
                          $failures += $failure
                          Write-Host "::error title=exp2 $($case.Name) runtime::$failure"
                      } else {
                          Write-Host "=== exp2 $($case.Name) PASS ==="
                      }
                  }
              } finally {
                  Remove-Item -LiteralPath $executable -Force -ErrorAction SilentlyContinue
              }
          }

          if ($failures.Count -ne 0) {
              Write-Host "=== exp2 range summary: FAIL ==="
              foreach ($failure in $failures) {
                  Write-Host "  $failure"
              }
              throw "exp2 range validation failed in $($failures.Count) architecture phase(s)"
          }
          Write-Host "=== exp2 range summary: PASS ==="

      - name: validate secure CRT fopen_s/freopen_s with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/crt_secure_freopen.c"
          $cases = @(
              @{ Id = "x64"; Name = "x64"; Compiler = "work/thirdparty/tcc/tcc.exe" },
              @{ Id = "i386"; Name = "i386"; Compiler = "work/thirdparty/tcc/i386-win32-tcc.exe" }
          )

          foreach ($case in $cases) {
              $token = [guid]::NewGuid().ToString("N")
              $executable = Join-Path $env:RUNNER_TEMP "crt_secure_freopen_$($case.Id)_$token.exe"
              $dataPath = Join-Path $env:RUNNER_TEMP "crt_secure_freopen_$($case.Id)_$token.tmp"
              try {
                  $compilerArgs = @(
                      "-Wall",
                      "-Werror",
                      "-Werror=implicit-function-declaration",
                      "-o",
                      $executable,
                      $probe
                  )
                  & $case.Compiler @compilerArgs
                  if ($LASTEXITCODE -ne 0) {
                      throw "$($case.Name) secure CRT fopen_s/freopen_s probe failed to compile or link"
                  }

                  & $executable $dataPath
                  if ($LASTEXITCODE -ne 0) {
                      throw "$($case.Name) secure CRT fopen_s/freopen_s probe failed at runtime"
                  }
              } finally {
                  foreach ($path in @($executable, $dataPath)) {
                      Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
                  }
              }
          }

      - name: validate WinAPI declarations with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_create_symbolic_link.c"
          $x64Ansi = "$env:RUNNER_TEMP/winapi_create_symbolic_link_x64_ansi.exe"
          $x64Unicode = "$env:RUNNER_TEMP/winapi_create_symbolic_link_x64_unicode.exe"
          $i386Ansi = "$env:RUNNER_TEMP/winapi_create_symbolic_link_i386_ansi.exe"
          $i386Unicode = "$env:RUNNER_TEMP/winapi_create_symbolic_link_i386_unicode.exe"

          & work/thirdparty/tcc/tcc.exe `
              -Werror=implicit-function-declaration `
              -o $x64Ansi $probe
          if ($LASTEXITCODE -ne 0) {
              throw "x64 ANSI WinAPI conformance probe failed"
          }

          & work/thirdparty/tcc/tcc.exe `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $x64Unicode $probe
          if ($LASTEXITCODE -ne 0) {
              throw "x64 Unicode WinAPI conformance probe failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Werror=implicit-function-declaration `
              -o $i386Ansi $probe
          if ($LASTEXITCODE -ne 0) {
              throw "i386 ANSI WinAPI conformance probe failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $i386Unicode $probe
          if ($LASTEXITCODE -ne 0) {
              throw "i386 Unicode WinAPI conformance probe failed"
          }

      - name: validate CancelIoEx ABI with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_cancel_io_ex.c"
          $cases = @(
              @{ Id = "x64"; Compiler = "work/thirdparty/tcc/tcc.exe" },
              @{ Id = "i386"; Compiler = "work/thirdparty/tcc/i386-win32-tcc.exe" }
          )

          foreach ($case in $cases) {
              $executable = "$env:RUNNER_TEMP/winapi_cancel_io_ex_$($case.Id).exe"
              & $case.Compiler `
                  -Wall -Wextra -Werror `
                  -Werror=implicit-function-declaration `
                  -o $executable $probe
              if ($LASTEXITCODE -ne 0) {
                  throw "$($case.Id) CancelIoEx ABI probe failed to compile"
              }
              & $executable
              if ($LASTEXITCODE -ne 0) {
                  throw "$($case.Id) CancelIoEx ABI probe failed at runtime"
              }
          }

      - name: validate synchapi aliases with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_synchapi_aliases.c"
          $architectures = @(
              @{ Id = "x64"; Name = "x64"; Compiler = "work/thirdparty/tcc/tcc.exe" },
              @{ Id = "i386"; Name = "i386"; Compiler = "work/thirdparty/tcc/i386-win32-tcc.exe" }
          )
          $characterSets = @(
              @{ Id = "ansi"; Name = "ANSI"; Defines = @() },
              @{ Id = "unicode"; Name = "Unicode"; Defines = @("-DUNICODE", "-D_UNICODE") }
          )
          $includeModes = @(
              @{ Id = "windows_first"; Name = "windows.h-first"; Defines = @() },
              @{ Id = "reverse"; Name = "windef.h-synchapi.h-winbase.h"; Defines = @("-DTCCBIN_SYNCHAPI_REVERSE_INCLUDE_ORDER") }
          )

          foreach ($architecture in $architectures) {
              foreach ($characterSet in $characterSets) {
                  foreach ($includeMode in $includeModes) {
                      $token = [guid]::NewGuid().ToString("N")
                      $executable = Join-Path $env:RUNNER_TEMP "winapi_synchapi_aliases_$($architecture.Id)_$($characterSet.Id)_$($includeMode.Id)_$token.exe"
                      try {
                          $compilerArgs = @(
                              "-Wall",
                              "-Wextra",
                              "-Werror",
                              "-Werror=implicit-function-declaration"
                          )
                          $compilerArgs += $characterSet.Defines
                          $compilerArgs += $includeMode.Defines
                          $compilerArgs += @("-o", $executable, $probe)

                          & $architecture.Compiler @compilerArgs
                          if ($LASTEXITCODE -ne 0) {
                              throw "$($architecture.Name) $($characterSet.Name) $($includeMode.Name) synchapi probe failed to compile or link"
                          }
                          & $executable
                          if ($LASTEXITCODE -ne 0) {
                              throw "$($architecture.Name) $($characterSet.Name) $($includeMode.Name) synchapi probe failed at runtime"
                          }
                      } finally {
                          Remove-Item -LiteralPath $executable -Force -ErrorAction SilentlyContinue
                      }
                  }
              }
          }

      - name: validate WSAConnectBy WinAPI declarations with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_wsa_connect_by_name.c"
          $x64Ansi = "$env:RUNNER_TEMP/winapi_wsa_connect_by_name_x64_ansi.exe"
          $x64Unicode = "$env:RUNNER_TEMP/winapi_wsa_connect_by_name_x64_unicode.exe"
          $i386Ansi = "$env:RUNNER_TEMP/winapi_wsa_connect_by_name_i386_ansi.exe"
          $i386Unicode = "$env:RUNNER_TEMP/winapi_wsa_connect_by_name_i386_unicode.exe"

          & work/thirdparty/tcc/tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -o $x64Ansi $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "x64 ANSI WSAConnectBy WinAPI conformance probe failed"
          }
          & $x64Ansi
          if ($LASTEXITCODE -ne 0) {
              throw "x64 ANSI WSAConnectBy WinAPI conformance probe execution failed"
          }

          & work/thirdparty/tcc/tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $x64Unicode $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "x64 Unicode WSAConnectBy WinAPI conformance probe failed"
          }
          & $x64Unicode
          if ($LASTEXITCODE -ne 0) {
              throw "x64 Unicode WSAConnectBy WinAPI conformance probe execution failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -o $i386Ansi $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "i386 ANSI WSAConnectBy WinAPI conformance probe failed"
          }
          & $i386Ansi
          if ($LASTEXITCODE -ne 0) {
              throw "i386 ANSI WSAConnectBy WinAPI conformance probe execution failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $i386Unicode $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "i386 Unicode WSAConnectBy WinAPI conformance probe failed"
          }
          & $i386Unicode
          if ($LASTEXITCODE -ne 0) {
              throw "i386 Unicode WSAConnectBy WinAPI conformance probe execution failed"
          }

      - name: validate InetNtop/InetPton WinAPI declarations with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_inet_ntop_pton.c"
          $x64Ansi = "$env:RUNNER_TEMP/winapi_inet_ntop_pton_x64_ansi.exe"
          $x64Unicode = "$env:RUNNER_TEMP/winapi_inet_ntop_pton_x64_unicode.exe"
          $i386Ansi = "$env:RUNNER_TEMP/winapi_inet_ntop_pton_i386_ansi.exe"
          $i386Unicode = "$env:RUNNER_TEMP/winapi_inet_ntop_pton_i386_unicode.exe"

          & work/thirdparty/tcc/tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -o $x64Ansi $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "x64 ANSI InetNtop/InetPton WinAPI conformance probe failed"
          }
          & $x64Ansi
          if ($LASTEXITCODE -ne 0) {
              throw "x64 ANSI InetNtop/InetPton WinAPI conformance probe execution failed"
          }

          & work/thirdparty/tcc/tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $x64Unicode $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "x64 Unicode InetNtop/InetPton WinAPI conformance probe failed"
          }
          & $x64Unicode
          if ($LASTEXITCODE -ne 0) {
              throw "x64 Unicode InetNtop/InetPton WinAPI conformance probe execution failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -o $i386Ansi $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "i386 ANSI InetNtop/InetPton WinAPI conformance probe failed"
          }
          & $i386Ansi
          if ($LASTEXITCODE -ne 0) {
              throw "i386 ANSI InetNtop/InetPton WinAPI conformance probe execution failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -DUNICODE -D_UNICODE `
              -o $i386Unicode $probe -lws2_32
          if ($LASTEXITCODE -ne 0) {
              throw "i386 Unicode InetNtop/InetPton WinAPI conformance probe failed"
          }
          & $i386Unicode
          if ($LASTEXITCODE -ne 0) {
              throw "i386 Unicode InetNtop/InetPton WinAPI conformance probe execution failed"
          }

      - name: validate shell drag/drop WinAPI declarations and imports with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_shell_drag_drop.c"
          if (-not (Test-Path "work/thirdparty/tcc/lib/shell32.def")) {
              throw "bundled shell32.def is missing"
          }

          $cases = @(
              @{ Id = "x64_ansi"; Name = "x64 ANSI"; Compiler = "work/thirdparty/tcc/tcc.exe"; Defines = @() },
              @{ Id = "x64_unicode"; Name = "x64 Unicode"; Compiler = "work/thirdparty/tcc/tcc.exe"; Defines = @("-DUNICODE", "-D_UNICODE") },
              @{ Id = "i386_ansi"; Name = "i386 ANSI"; Compiler = "work/thirdparty/tcc/i386-win32-tcc.exe"; Defines = @() },
              @{ Id = "i386_unicode"; Name = "i386 Unicode"; Compiler = "work/thirdparty/tcc/i386-win32-tcc.exe"; Defines = @("-DUNICODE", "-D_UNICODE") }
          )
          $linkModes = @(
              @{ Id = "pragma"; Name = "pragma"; Defines = @(); Libraries = @() },
              @{ Id = "explicit"; Name = "explicit -lshell32"; Defines = @("-DTCCBIN_NO_SHELL32_PRAGMA"); Libraries = @("-lshell32") }
          )

          foreach ($case in $cases) {
              foreach ($linkMode in $linkModes) {
                  $output = "$env:RUNNER_TEMP/winapi_shell_drag_drop_$($case.Id)_$($linkMode.Id).exe"
                  $compilerArgs = @("-Wall", "-Werror", "-Werror=implicit-function-declaration")
                  $compilerArgs += $case.Defines
                  $compilerArgs += $linkMode.Defines
                  $compilerArgs += @("-o", $output, $probe)
                  $compilerArgs += $linkMode.Libraries

                  & $case.Compiler @compilerArgs
                  if ($LASTEXITCODE -ne 0) {
                      throw "$($case.Name) shell drag/drop probe with $($linkMode.Name) failed"
                  }
                  & $output
                  if ($LASTEXITCODE -ne 0) {
                      throw "$($case.Name) shell drag/drop probe with $($linkMode.Name) execution failed"
                  }
              }
          }

      - name: validate RegDeleteKeyW import with x64 and i386 TCC
        shell: pwsh
        run: |
          $probe = "work/thirdparty/tcc/tests/winapi_reg_delete_key.c"
          $x64 = "$env:RUNNER_TEMP/winapi_reg_delete_key_x64.exe"
          $i386 = "$env:RUNNER_TEMP/winapi_reg_delete_key_i386.exe"

          & work/thirdparty/tcc/tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -o $x64 $probe -ladvapi32
          if ($LASTEXITCODE -ne 0) {
              throw "x64 RegDeleteKeyW conformance probe failed"
          }
          & $x64
          if ($LASTEXITCODE -ne 0) {
              throw "x64 RegDeleteKeyW conformance probe execution failed"
          }

          & work/thirdparty/tcc/i386-win32-tcc.exe `
              -Wall -Werror `
              -Werror=implicit-function-declaration `
              -o $i386 $probe -ladvapi32
          if ($LASTEXITCODE -ne 0) {
              throw "i386 RegDeleteKeyW conformance probe failed"
          }
          & $i386
          if ($LASTEXITCODE -ne 0) {
              throw "i386 RegDeleteKeyW conformance probe execution failed"
          }

      - name: run shared conformance tests
        shell: pwsh
        run: |
          work/thirdparty/tccbin_tests/run.ps1 -Tcc work/thirdparty/tcc/tcc.exe -Platform windows -- `
              -DGC_NOT_DLL -DGC_WIN32_THREADS -DGC_THREADS -DGC_BUILTIN_ATOMIC `
              -I work/thirdparty/libgc/include -bt25 -municode -ldbghelp -luser32 `
              work/thirdparty/tcc/lib/libgc.a
          if ($LASTEXITCODE -ne 0) { throw "conformance tests failed" }

      - name: report Phase A coverage and unresolved required lanes
        if: always()
        shell: pwsh
        run: |
          Write-Host "phase-a-scope=production-incomplete-read-only"
          Write-Host "eligibility=false reason=staged_provenance_incomplete publish_allowed=false"
          Write-Host "committed-payload-covered=manifest-contract[x64,i386];source-provenance[x64,incomplete/nonpublishable];payload-inventory[x64,i386];artifact-digests[x64,i386];publish-preflight-dry-run[x64];v-no-fallback-smoke[x64,gc=none]"
          Write-Host "rebuilt-payload-covered=native-build[x64,i386];patch-0003[x64,i386];patch-0004[x64,i386];patch-0005[x64,i386];patch-0006[x64,i386];patch-0007[x64,i386];patch-0008[x64,i386];patch-0009[x64,i386];header-condition-variable[x64,i386];tccbin-conformance[x64]"
          Write-Host "missing-required-lanes=patch-probes[x64,i386];patch-0001[x64,i386];patch-0002[x64,i386];header-gmtime-s[x64,i386];header-faststorefence[x64,i386];tccbin-conformance[i386];bdwgc-v-integration[x64];opaque-openlibm[x64-fontstash,x64-json,x64-math,x64-stbi,x64-vorbis]"
          Write-Host "limitation=feature probes after build.ps1 exercise rebuilt artifacts; they do not prove committed-payload feature behavior"

  tccbin-branch-gate:
    name: tccbin-branch-gate
    if: >-
      always() &&
      github.repository == 'vlang/tccbin' &&
      (
        (github.event_name == 'pull_request' &&
          github.base_ref == 'thirdparty-windows-amd64') ||
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/thirdparty-windows-amd64')
      )
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require successful baseline validation
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
